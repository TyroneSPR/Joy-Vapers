services:
  - type: web
    name: joy-vapers
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: joy-vapers-data
      mountPath: /var/data
      sizeGB: 1
